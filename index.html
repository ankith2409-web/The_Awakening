<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Authentication screens carry no public content; keep them out of
         search indexes. Mirrors public/robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="The Awakening: AI agents — built by you. A Fetch AI event by Google Developer Groups. Registration, entry pass and event status."
    />

    <!-- Inter: high x-height grotesque, the closest web analogue to Helvetica.
         Preconnect avoids a round-trip on the critical font request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <title>The Awakening: AI agents — Fetch AI by GDG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
